<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shofe Night Owl</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial}
.header{display:flex;align-items:center;padding:15px;background:#8d2bd4}
.header img{width:50px;height:50px;border-radius:14px;margin-right:12px}
.card{background:#222;margin:10px;border-radius:12px;padding:16px}
.info{background:#2a1a3a;border-left:4px solid #8d2bd4;padding:12px;border-radius:8px;margin-bottom:12px;font-size:14px}
input{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #444;background:#333;color:#fff;font-size:15px}
.btn{width:100%;padding:16px;border:0;border-radius:14px;background:linear-gradient(90deg,#8d2bd4,#6514a5);color:#fff;font-weight:900;font-size:16px;margin-top:10px}
.status{margin-top:10px;color:#d48fff;text-align:center}
.back{display:block;text-align:center;margin:15px;color:#888;text-decoration:none}
</style>
</head>
<body>
<div class="header">
  <img src="assets/shofe-logo.png" alt="Shofe">
  <h1>🌙 NIGHT OWL</h1>
</div>

<div class="card">
  <div class="info">
    <b>How it works:</b> Had drinks? $20 base + $1/km. 
    We drive YOUR car home safely. 24/7 in Harare.
  </div>
  <h2>Drive My Car Home</h2>
  <input id="nPickup" placeholder="📍 Where are you now? e.g. Club 1Eighty">
  <input id="nDropoff" placeholder="🏠 Where is home? e.g. Borrowdale">
  <input id="nCar" placeholder="🚗 Car Details e.g. Honda Fit Red">
  <input id="nPhone" type="tel" placeholder="📞 Your Number +263">
  
  <button class="btn" onclick="requestNightOwl()">BOOK DRIVER NOW</button>
  <p id="nStatus" class="status"></p>
</div>

<a href="index.html" class="back">← Back to Home</a>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"PASTE_YOURS", projectId:"shofe-zim"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function requestNightOwl(){
  const pickup = nPickup.value;
  const dropoff = nDropoff.value;
  const car = nCar.value;
  const phone = nPhone.value;
  
  if(!pickup || !dropoff || !phone){
    nStatus.innerText = "⚠️ Please fill all fields";
    return;
  }
  
  db.collection("jobs").add({
    type: "nightowl",
    pickup, dropoff, car, phone,
    status: "open",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    nStatus.innerText = `✅ Driver assigned! We will call ${phone} in 5 minutes`;
    nPickup.value = ""; nDropoff.value = ""; nPhone.value = "";
  });
}
</script>
</body>
</html>
