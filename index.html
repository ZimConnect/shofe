
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ShofeRider | Drive, Deliver, Earn with ZimConnect</title>
<link rel="icon" href="assets/shofe-logo.png">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f5f7}
.header{background:linear-gradient(110deg,#006400 0%,#f7a800 50%,#d71920 100%);color:#fff;text-align:center;padding:40px 15px}
.logo{width:120px;height:120px;border-radius:24px;background:#fff;padding:10px;box-shadow:0 4px 15px #0003}
.header h1{margin:12px 0 5px;font-size:34px}
.btn{display:block;background:#006400;color:#fff;text-align:center;padding:16px;border-radius:10px;text-decoration:none;font-weight:bold;font-size:17px;margin:12px 15px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:15px}
.card{background:#fff;padding:15px;border-radius:12px;box-shadow:0 2px 8px #0001;text-align:center}
.card h3{margin:8px 0;color:#006400;font-size:15px}
.section{background:#fff;margin:15px;border-radius:12px;padding:15px}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
</style>
</head>
<body>

<div class="header">
  <img src="assets/shofe-logo.png" alt="Shofe Logo" class="logo">
  <h1>ShofeRider</h1>
  <p>Driver App for ZimConnect 🇿🇼</p>
  <p>Earn in USD. Drive City, Long Distance, Courier</p>
</div>

<!-- DOWNLOAD BUTTON -->
<a href="https://github.com/ZimC/shofe-rider/releases/download/v1.0/shoferider.apk" class="btn">📱 DOWNLOAD ANDROID APP</a>

<!-- SERVICES GRID -->
<div class="grid">
  <div class="card"><div style="font-size:28px">🚕</div><h3>CITY DRIVER</h3></div>
  <div class="card"><div style="font-size:28px">🛣️</div><h3>CITY TO CITY</h3></div>
  <div class="card"><div style="font-size:28px">🏍️</div><h3>BIKER COURIER</h3></div>
  <div class="card"><div style="font-size:28px">📦</div><h3>PACKAGING</h3></div>
  <div class="card"><div style="font-size:28px">🟢</div><h3>LIVE BUTTON</h3></div>
  <div class="card"><div style="font-size:28px">🛠️</div><h3>ROADSIDE</h3></div>
  <div class="card"><div style="font-size:28px">🗺️</div><h3>OFFLINE MAPS</h3></div>
  <div class="card"><div style="font-size:28px">🔔</div><h3>PUSH ALERTS</h3></div>
</div>

<!-- DRIVER SIGNUP -->
<div class="section">
  <h2 style="color:#006400">🚀 Become a Shofe Driver</h2>
  <input id="dName" placeholder="Full Name">
  <input id="dPhone" placeholder="WhatsApp +263...">
  <select id="dType">
    <option value="">Vehicle Type</option>
    <option value="car">City Car</option>
    <option value="long">City to City</option>
    <option value="bike">Biker Courier</option>
    <option value="van">Van/Truck</option>
  </select>
  <button class="btn" onclick="alert('Application Sent!')">SUBMIT APPLICATION</button>
</div>

<a href="https://zimc.github.io/Connectzim/" class="btn" style="background:#444">⬅️ BACK TO ZIMCONNECT</a>

</body>
</html>
