<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shofe - Zim's Ride App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;color:#fff;background:linear-gradient(145deg,#03100a 0%,#07130e 100%);overflow:hidden;font-family:Arial}
.app{max-width:900px;height:100vh;margin:auto;padding:12px 16px;display:flex;flex-direction:column}

.topbar{height:52px;display:flex;align-items:center;justify-content:space-between}
.icon-btn{width:44px;height:44px;border-radius:14px;background:rgba(0,0,0,.28);color:#fff;font-size:22px;display:grid;place-items:center;border:none}

.hero{text-align:center;padding:10px 0}
.logo-wrap{width:min(45vw, 200px);height:min(45vw, 200px);margin:0 auto 8px;border-radius:32px;overflow:hidden}
.logo{width:100%;height:100%;object-fit:contain}
.hero h1{font-size:clamp(32px,8vw,60px);font-weight:900;margin-bottom:4px}
.hero p{color:#65e994;font-size:clamp(11px,3vw,16px);font-weight:700;text-transform:uppercase}

.features{display:flex;gap:15px;justify-content:center;margin:8px 0;font-size:12px;color:#ddd}
.features div{display:flex;align-items:center;gap:5px}

.actions{display:grid;gap:10px;flex:1}
.action{
  position:relative;width:100%;border:0;border-radius:18px;padding:16px 50px 16px 60px;
  color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:center;
}
.action-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:28px}
.action h2{font-size:17px;font-weight:900;margin-bottom:2px}
.action p{font-size:13px;color:rgba(255,255,255,.85)}
.arrow{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:24px}

.ride{background:linear-gradient(90deg,#00c853,#00a844)}
.drive{background:linear-gradient(90deg,#1685e8,#0966c8)}
.roadside{background:linear-gradient(90deg,#ff8500,#ff5f00)}
.night{background:linear-gradient(90deg,#8d2bd4,#6514a5)}

.safety{margin-top:8px;padding:14px 16px;border-radius:16px;background:rgba(8,29,21,.9);display:flex;align-items:center;gap:12px}
.safety-icon{font-size:24px}
.safety-arrow{margin-left:auto;font-size:22px;color:#00d95a}

.bottom-features{margin-top:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:11px}
.bottom-feature .ico{font-size:20px;color:#00d95a}
.footer{text-align:center;color:#68716d;font-size:10px;margin-top:6px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="icon-btn" onclick="openPanel('menuPanel')">☰</button>
    <button class="icon-btn" onclick="showNotice()">🔔</button>
  </div>

  <section class="hero">
    <div class="logo-wrap"><img src="assets/shofe-logo.png" class="logo" alt="Shofe"></div>
    <h1>SHOFE</h1>
    <p>ZIM'S #1 RIDE, HELP & DRIVE HOME APP</p>
  </section>

  <div class="features">
    <div>🛡️ Safe Rides</div><div>⭐ Trusted Drivers</div><div>🔔 24/7 Support</div>
  </div>

  <main class="actions">
  <button class="action ride" onclick="go('shofe-passenger.html')">
    <span class="action-icon">🚕</span><h2>I NEED A RIDE</h2><p>Book a ride in minutes</p><span class="arrow">›</span>
  </button>

  <button class="action drive" onclick="go('shofe-driver.html')">
    <span class="action-icon">🚗</span><h2>I WANT TO DRIVE</h2><p>Join and start earning</p><span class="arrow">›</span>
  </button>

  <button class="action roadside" onclick="go('shofe-roadside.html')">
    <span class="action-icon">🔧</span><h2>ROADSIDE ASSISTANCE</h2><p>Help is just a tap away</p><span class="arrow">›</span>
  </button>

  <button class="action night" onclick="go('shofe-nightowl.html')">
    <span class="action-icon">🌙</span><h2>NIGHT OWL</h2><p>Drive my car, I'll drive you</p><span class="arrow">›</span>
  </button>
</main>

  <div class="safety" onclick="openPanel('safetyPanel')">
    <span class="safety-icon">🛡️</span><div><b>Your Safety, Our Priority</b><br><small>Verified drivers. Secure rides.</small></div><span class="safety-arrow">›</span>
  </div>

  <div class="bottom-features">
    <div class="bottom-feature"><div class="ico">⚡</div>Fast</div>
    <div class="bottom-feature"><div class="ico">$</div>Affordable</div>
    <div class="bottom-feature"><div class="ico">🛡️</div>Reliable</div>
    <div class="bottom-feature"><div class="ico">🇿🇼</div>Zimbabwe</div>
  </div>
  <div class="footer">© 2026 Shofe • Harare</div>
</div>

<script>
function go(url){ window.location.href=url; }
function openPanel(id){ document.getElementById(id).classList.add('show'); }
function closePanel(id){document.getElementById(id).classList.remove('show')}
function showNotice(){ alert('🔔 No new notifications'); }
</script>
</body>
</html>
