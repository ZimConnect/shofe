<!DOCTYPE html>
<html>
<head>
<title>Shofe - Zim's Ride & Help App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#0a0a0a;color:white;text-align:center;padding:10px;margin:0}
.logo-container{padding:30px 0 10px 0}
.logo{width:80%;max-width:300px;height:auto;object-fit:contain;margin:0 auto;display:block}
h1{margin:10px 0;font-size:32px;color:#00c853}
.subtitle{color:#aaa;margin-bottom:30px}
.btn{display:block;width:90%;max-width:400px;margin:15px auto;padding:22px;border:none;border-radius:14px;font-size:18px;font-weight:bold;cursor:pointer;transition:0.2s}
.btn:active{transform:scale(0.97)}
.green{background:#00c853;color:white}
.blue{background:#1976d2;color:white}
.orange{background:#ff6f00;color:white}
.purple{background:#8e24aa;color:white}
.footer{margin-top:40px;font-size:12px;color:#555}
</style>
</head>
<body>
  <div class="logo-container">
    <img src="assets/shofe-logo.png" class="logo" alt="Shofe Logo">
  </div>
  <h1>SHOFE</h1>
  <p class="subtitle">Zim's #1 Ride, Help & Drive Home App</p>
  
  <button class="btn green" onclick="location.href='app.html?mode=passenger'">🚖 I NEED A RIDE</button>
  <button class="btn blue" onclick="location.href='app.html?mode=driver'">🚗 I WANT TO DRIVE</button>
  <button class="btn orange" onclick="location.href='app.html?mode=roadside'">🔧 ROADSIDE ASSISTANCE</button>
  <button class="btn purple" onclick="location.href='app.html?mode=nightowl'">🌙 NIGHT OWL - DRIVE MY CAR</button>
  
  <p class="footer">© Shofe 2026 - Harare, Zimbabwe</p>
</body>
</html>
