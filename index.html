<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Shofe - Zim's Ride App</title><style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  color:#fff;
  background:linear-gradient(145deg,#03100a 0%,#07130e 100%);
  font-family:Arial,sans-serif;
}

button{
  font-family:inherit;
  cursor:pointer;
  -webkit-appearance:none;
}

.app{
  max-width:900px;
  width:100%;
  height:100vh;
  height:100dvh;
  margin:auto;
  padding:12px 16px;
  display:flex;
  flex-direction:column;
}

/* TOP BAR */

.topbar{
  height:52px;
  min-height:52px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.icon-btn{
  width:44px;
  height:44px;
  border-radius:14px;
  background:rgba(0,0,0,.35);
  color:#fff;
  font-size:22px;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.08);
}

.icon-btn:active{
  transform:scale(.92);
  background:rgba(0,200,83,.35);
}

/* HERO */

.hero{
  text-align:center;
  padding:6px 0;
}

.logo-wrap{
  width:min(38vw,150px);
  height:min(38vw,150px);
  margin:0 auto 6px;
  border-radius:28px;
  overflow:hidden;
}

.logo{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.hero h1{
  font-size:clamp(30px,8vw,58px);
  font-weight:900;
  margin-bottom:3px;
  letter-spacing:1px;
}

.hero p{
  color:#65e994;
  font-size:clamp(10px,2.8vw,15px);
  font-weight:700;
  text-transform:uppercase;
}

/* FEATURES */

.features{
  display:flex;
  gap:12px;
  justify-content:center;
  margin:6px 0;
  font-size:11px;
  color:#ddd;
  flex-wrap:wrap;
}

.features div{
  display:flex;
  align-items:center;
  gap:4px;
}

/* ACTION BUTTONS */

.actions{
  display:grid;
  gap:9px;
  flex:1;
  min-height:0;
}

.action{
  position:relative;
  width:100%;
  min-height:58px;
  border:0;
  border-radius:18px;
  padding:12px 50px 12px 60px;
  color:#fff;
  text-align:left;
  display:flex;
  flex-direction:column;
  justify-content:center;
  box-shadow:0 5px 15px rgba(0,0,0,.18);
  transition:transform .12s ease,filter .12s ease;
  overflow:hidden;
}

.action:active{
  transform:scale(.97);
  filter:brightness(1.12);
}

.action-icon{
  position:absolute;
  left:18px;
  top:50%;
  transform:translateY(-50%);
  font-size:28px;
}

.action h2{
  font-size:16px;
  font-weight:900;
  margin-bottom:2px;
}

.action p{
  font-size:12px;
  color:rgba(255,255,255,.88);
}

.arrow{
  position:absolute;
  right:18px;
  top:50%;
  transform:translateY(-50%);
  font-size:27px;
}

.ride{
  background:linear-gradient(90deg,#00c853,#00a844);
}

.drive{
  background:linear-gradient(90deg,#1685e8,#0966c8);
}

.roadside{
  background:linear-gradient(90deg,#ff8500,#ff5f00);
}

.night{
  background:linear-gradient(90deg,#8d2bd4,#6514a5);
}

/* SAFETY */

.safety{
  margin-top:7px;
  padding:12px 15px;
  min-height:56px;
  border-radius:16px;
  background:rgba(8,29,21,.95);
  border:1px solid rgba(0,217,90,.12);
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  transition:transform .12s ease;
}

.safety:active{
  transform:scale(.97);
}

.safety-icon{
  font-size:24px;
}

.safety-arrow{
  margin-left:auto;
  font-size:22px;
  color:#00d95a;
}

/* BOTTOM FEATURES */

.bottom-features{
  margin-top:6px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  text-align:center;
  font-size:10px;
}

.bottom-feature .ico{
  font-size:18px;
  color:#00d95a;
}

.footer{
  text-align:center;
  color:#68716d;
  font-size:9px;
  margin-top:5px;
}

/* PANELS */

.panel-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:9999;
  padding:0;
}

.panel-overlay.show{
  display:flex;
}

.panel{
  width:100%;
  max-width:500px;
  background:#0b1913;
  border-radius:25px 25px 0 0;
  padding:22px;
  box-shadow:0 -10px 40px rgba(0,0,0,.5);
  animation:slideUp .2s ease;
}

@keyframes slideUp{
  from{
    transform:translateY(100%);
  }
  to{
    transform:translateY(0);
  }
}

.panel h2{
  margin-bottom:15px;
  font-size:22px;
}

.panel button{
  width:100%;
  border:0;
  padding:15px;
  margin:5px 0;
  border-radius:13px;
  background:#13251c;
  color:#fff;
  text-align:left;
  font-size:15px;
}

.panel button:active{
  background:#00a844;
}

.close-btn{
  background:#222 !important;
  text-align:center !important;
  margin-top:12px !important;
}

/* SMALL PHONES */

@media(max-height:650px){

  .logo-wrap{
    width:90px;
    height:90px;
  }

  .hero h1{
    font-size:30px;
  }

  .hero p{
    font-size:9px;
  }

  .features{
    margin:3px 0;
  }

  .action{
    min-height:50px;
    padding-top:8px;
    padding-bottom:8px;
  }

  .action-icon{
    font-size:24px;
  }

  .action h2{
    font-size:14px;
  }

  .action p{
    font-size:11px;
  }

  .safety{
    min-height:48px;
    padding:9px 12px;
  }
}
</style></head><body><div class="app">  <!-- TOP BAR -->  <div class="topbar"><button
  class="icon-btn"
  type="button"
  onclick="openPanel('menuPanel')"
  aria-label="Open menu">
  ☰
</button>

<button
  class="icon-btn"
  type="button"
  onclick="showNotice()"
  aria-label="Notifications">
  🔔
</button>

  </div>  <!-- HERO -->  <section class="hero"><div class="logo-wrap">
  <img
    src="assets/shofe-logo.png"
    class="logo"
    alt="Shofe"
    onerror="this.style.display='none';document.querySelector('.logo-wrap').innerHTML='🚕';document.querySelector('.logo-wrap').style.fontSize='70px';document.querySelector('.logo-wrap').style.display='grid';document.querySelector('.logo-wrap').style.placeItems='center';">
</div>

<h1>SHOFE</h1>

<p>
  ZIM'S #1 RIDE, HELP & DRIVE HOME APP
</p>

  </section>  <!-- FEATURES -->  <div class="features"><div>🛡️ Safe Rides</div>

<div>⭐ Trusted Drivers</div>

<div>🔔 24/7 Support</div>

  </div>  <!-- MAIN ACTIONS -->  <main class="actions"><button
  class="action ride"
  type="button"
  onclick="navigateTo('shofe-passenger.html')">

  <span class="action-icon">🚕</span>

  <h2>I NEED A RIDE</h2>

  <p>Book a ride in minutes</p>

  <span class="arrow">›</span>

</button>


<button
  class="action drive"
  type="button"
  onclick="navigateTo('shofe-driver.html')">

  <span class="action-icon">🚗</span>

  <h2>I WANT TO DRIVE</h2>

  <p>Join and start earning</p>

  <span class="arrow">›</span>

</button>


<button
  class="action roadside"
  type="button"
  onclick="navigateTo('shofe-roadside.html')">

  <span class="action-icon">🔧</span>

  <h2>ROADSIDE ASSISTANCE</h2>

  <p>Help is just a tap away</p>

  <span class="arrow">›</span>

</button>


<button
  class="action night"
  type="button"
  onclick="navigateTo('shofe-nightowl.html')">

  <span class="action-icon">🌙</span>

  <h2>NIGHT OWL</h2>

  <p>Drive my car, I'll drive you</p>

  <span class="arrow">›</span>

</button>

  </main>  <!-- SAFETY -->  <div
    class="safety"
    onclick="openPanel('safetyPanel')"><span class="safety-icon">🛡️</span>

<div>
  <b>Your Safety, Our Priority</b>
  <br>
  <small>Verified drivers. Secure rides.</small>
</div>

<span class="safety-arrow">›</span>

  </div>  <!-- BOTTOM FEATURES -->  <div class="bottom-features"><div class="bottom-feature">
  <div class="ico">⚡</div>
  Fast
</div>

<div class="bottom-feature">
  <div class="ico">$</div>
  Affordable
</div>

<div class="bottom-feature">
  <div class="ico">🛡️</div>
  Reliable
</div>

<div class="bottom-feature">
  <div class="ico">🇿🇼</div>
  Zimbabwe
</div>

  </div>  <div class="footer">
    © 2026 Shofe • Harare
  </div></div><!-- MENU PANEL --><div
  id="menuPanel"
  class="panel-overlay"
  onclick="closeOutside(event,'menuPanel')">  <div class="panel"><h2>🚕 SHOFE MENU</h2>

<button type="button" onclick="navigateTo('shofe-passenger.html')">
  🚕 Book a Ride
</button>

<button type="button" onclick="navigateTo('shofe-driver.html')">
  🚗 Become a Driver
</button>

<button type="button" onclick="navigateTo('shofe-roadside.html')">
  🔧 Roadside Assistance
</button>

<button type="button" onclick="navigateTo('shofe-nightowl.html')">
  🌙 Night Owl
</button>

<button type="button" onclick="showAbout()">
  ℹ️ About Shofe
</button>

<button
  type="button"
  class="close-btn"

  ✕ Close
</button>

  </div></div><!-- SAFETY PANEL --><div
  id="safetyPanel"
  class="panel-overlay"
  onclick="closeOutside(event,'safetyPanel')">  <div class="panel"><h2>🛡️ Your Safety</h2>

<button type="button">
  ✅ Verified Drivers
</button>

<button type="button">
  🔒 Secure Ride Requests
</button>

<button type="button">
  📞 24/7 Support
</button>

<button type="button">
  📍 Ride Tracking
</button>

<button
  type="button"
  class="close-btn"
  onclick="closePanel('safetyPanel')">
  ✕ Close
</button>

  </div></div><script>

/* =========================================
   SHOFE NAVIGATION
========================================= */

function navigateTo(page){

  if(!page){
    return;
  }

  // Close any open panels first
  document.querySelectorAll('.panel-overlay')
    .forEach(function(panel){
      panel.classList.remove('show');
    });

  // Navigate
  window.location.assign(page);
}


/* =========================================
   OPEN PANEL
========================================= */

function openPanel(id){

  const panel = document.getElementById(id);

  if(panel){
    panel.classList.add('show');
  }

}


/* =========================================
   CLOSE PANEL
========================================= */

function closePanel(id){

  const panel = document.getElementById(id);

  if(panel){
    panel.classList.remove('show');
  }

}


/* =========================================
   CLOSE WHEN CLICKING OUTSIDE
========================================= */

function closeOutside(event,id){

  if(event.target.id === id){
    closePanel(id);
  }

}


/* =========================================
   NOTIFICATIONS
========================================= */

function showNotice(){

  alert(
    "🔔 SHOFE NOTIFICATIONS\n\n" +
    "No new notifications right now."
  );

}


/* =========================================
   ABOUT
========================================= */

function showAbout(){

  closePanel('menuPanel');

  setTimeout(function(){

    alert(
      "🚕 SHOFE\n\n" +
      "Zimbabwe's Ride, Help & Drive Home App.\n\n" +
      "Fast • Affordable • Reliable • Zimbabwean\n\n" +
      "© 2026 Shofe • Harare"
    );

  },150);

}


/* =========================================
   ANDROID BACK / ESCAPE SUPPORT
========================================= */

document.addEventListener('keydown',function(event){

  if(event.key === 'Escape'){

    document.querySelectorAll('.panel-overlay')
      .forEach(function(panel){
        panel.classList.remove('show');
      });

  }

});

</script></body>
</html>
