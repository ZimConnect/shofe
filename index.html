<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06140d">
<title>Shofe - Zim's Ride, Help & Drive Home App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{
  color:#fff;
  background:
    radial-gradient(circle at 50% -10%,rgba(0,200,83,.22),transparent 36%),
    linear-gradient(145deg,#03100a 0%,#07130e 45%,#05090b 100%);
  overflow:hidden; /* NO SCROLL */
}
button,a{font:inherit} button{cursor:pointer}

/* FIT TO SCREEN */
.app{
  max-width:900px;
  height:100vh; /* FULL SCREEN HEIGHT */
  margin:auto;
  padding:12px 16px 12px;
  display:flex;
  flex-direction:column;
  justify-content:space-between; /* SPREADS CONTENT */
}

.topbar{height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.icon-btn{
  width:44px;height:44px;border:1px solid rgba(255,255,255,.15);border-radius:14px;
  background:rgba(0,0,0,.28);color:#fff;font-size:22px;display:grid;place-items:center;
}
.menu-lines span{display:block;width:24px;height:3px;background:#fff;border-radius:3px;margin:5px auto}
.bell{position:relative}
.dot{position:absolute;width:8px;height:8px;border-radius:50%;background:#00e676;right:6px;top:5px;border:2px solid #07130e}

/* HERO SHRINKS TO FIT */
.hero{text-align:center;padding:8px 0;flex-shrink:0}
.logo-wrap{
  width:min(45vw, 200px); /* SCALES WITH SCREEN */
  height:min(45vw, 200px);
  margin:0 auto 8px;border-radius:40px;
  display:grid;place-items:center;overflow:hidden;
  filter:drop-shadow(0 12px 20px rgba(0,0,0,.45));
}
.logo{width:100%;height:100%;object-fit:contain}
.hero h1{font-size:clamp(32px,8vw,60px);line-height:1;color:#fff;font-weight:900;letter-spacing:2px;text-shadow:0 4px 12px #000;margin-bottom:6px}
.hero p{color:#65e994;font-size:clamp(11px,3vw,16px);font-weight:700;letter-spacing:.6px;text-transform:uppercase}

.features{display:flex;justify-content:center;align-items:center;gap:0;margin:8px auto;max-width:720px;flex-shrink:0}
.feature{flex:1;text-align:center;color:#ddd;font-size:clamp(11px,2.8vw,14px)}
.feature strong{display:block;color:#00e676;font-size:clamp(20px,5vw,26px);margin-bottom:3px}
.feature:not(:last-child){border-right:1px solid rgba(255,255,255,.2)}

/* ACTIONS TAKE REMAINING SPACE */
.actions{display:grid;gap:10px;flex:1;min-height:0}
.action{
  position:relative;width:100%;min-height:0;
  border:0;border-radius:20px;
  color:#fff;text-align:left;padding:12px 50px 12px 90px;
  box-shadow:0 8px 20px rgba(0,0,0,.32);overflow:hidden;
  transition:transform .18s,filter .18s;
  display:flex;flex-direction:column;justify-content:center;
}
.action:hover{transform:translateY(-2px);filter:brightness(1.08)}
.ride{background:linear-gradient(135deg,#00c853,#00a844)}
.drive{background:linear-gradient(135deg,#1685e8,#0966c8)}
.roadside{background:linear-gradient(135deg,#ff8500,#ff5f00)}
.night{background:linear-gradient(135deg,#8d2bd4,#6514a5)}
.action-icon{
  position:absolute;left:20px;top:50%;transform:translateY(-50%);
  width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.72);
  display:grid;place-items:center;font-size:30px
}
.action h2{font-size:clamp(16px,4vw,20px);font-weight:900;margin-bottom:3px}
.action p{font-size:clamp(12px,3vw,14px);color:rgba(255,255,255,.88);line-height:1.2}
.arrow{
  position:absolute;right:18px;top:50%;transform:translateY(-50%);
  width:40px;height:40px;border-radius:50%;background:#fff;color:#08733a;
  display:grid;place-items:center;font-size:28px;font-weight:300
}

.safety{
  margin-top:8px;padding:12px 16px;border-radius:16px;background:rgba(8,29,21,.9);
  border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:12px;cursor:pointer;flex-shrink:0
}
.safety-icon{width:44px;height:44px;border-radius:50%;background:#10c95a;display:grid;place-items:center;font-size:22px;flex:none}
.safety h3{font-size:15px;margin-bottom:2px}.safety p{color:#aaa;font-size:12px}.safety-arrow{margin-left:auto;font-size:24px;color:#00d95a}

.bottom-features{
  margin-top:8px;border:1px solid rgba(255,255,255,.14);border-radius:20px;
  padding:10px 8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
  background:rgba(4,15,11,.75);flex-shrink:0
}
.bottom-feature{text-align:center;color:#ddd;font-size:11px}
.bottom-feature .ico{font-size:22px;color:#00d95a;margin-bottom:2px}.bottom-feature small{display:block;color:#999;font-size:9px;margin-top:1px}
.footer{text-align:center;color:#68716d;font-size:10px;margin-top:6px;flex-shrink:0}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(5px);z-index:20;padding:18px;overflow:auto}
.overlay.show{display:block}
.panel{
  max-width:560px;margin:25px auto;background:#101814;border:1px solid #294436;border-radius:24px;
  box-shadow:0 25px 70px #000;padding:22px
}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.close{background:#222;color:#fff;border:1px solid #444;width:40px;height:40px;border-radius:12px;font-size:22px}
.menu-item{
  width:100%;padding:16px;border:1px solid #294436;background:#15211b;color:#fff;border-radius:14px;
  text-align:left;font-weight:700;margin:8px 0;cursor:pointer
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="icon-btn" onclick="openPanel('menuPanel')">☰</button>
    <button class="icon-btn bell" onclick="showNotice()">🔔<span class="dot"></span></button>
  </div>

  <section class="hero">
    <div class="logo-wrap">
      <img src="assets/shofe-logo.png" class="logo" alt="Shofe logo">
    </div>
    <h1>SHOFE</h1>
    <p>ZIM'S #1 RIDE, HELP & DRIVE HOME APP</p>
  </section>

  <div class="features">
    <div class="feature"><strong>🛡️</strong>Safe Rides</div>
    <div class="feature"><strong>⭐</strong>Trusted Drivers</div>
    <div class="feature"><strong>🔔</strong>24/7 Support</div>
  </div>

  <main class="actions">
    <button class="action ride" onclick="go('app.html?mode=passenger')">
      <span class="action-icon">🚕</span><h2>I NEED A RIDE</h2><p>Book a ride in minutes</p><span class="arrow">›</span>
    </button>
    <button class="action drive" onclick="go('app.html?mode=driver')">
      <span class="action-icon">🚗</span><h2>I WANT TO DRIVE</h2><p>Join and start earning</p><span class="arrow">›</span>
    </button>
    <button class="action roadside" onclick="go('app.html?mode=roadside')">
      <span class="action-icon">🔧</span><h2>ROADSIDE ASSISTANCE</h2><p>Help is just a tap away</p><span class="arrow">›</span>
    </button>
    <button class="action night" onclick="go('app.html?mode=nightowl')">
      <span class="action-icon">🌙</span><h2>NIGHT OWL</h2><p>Drive my car, I'll drive you</p><span class="arrow">›</span>
    </button>
  </main>

  <div class="safety" onclick="openPanel('safetyPanel')">
    <div class="safety-icon">🛡️</div>
    <div><h3>Your Safety, Our Priority</h3><p>Verified drivers. Secure rides.</p></div>
    <div class="safety-arrow">›</div>
  </div>

  <div class="bottom-features">
    <div class="bottom-feature"><div class="ico">⚡</div>Fast<small>Quick pickups</small></div>
    <div class="bottom-feature"><div class="ico">$</div>Affordable<small>Fair prices</small></div>
    <div class="bottom-feature"><div class="ico">🛡️</div>Reliable<small>Always there</small></div>
    <div class="bottom-feature"><div class="ico">🇿🇼</div>Zimbabwe<small>Proudly local</small></div>
  </div>
  <div class="footer">© 2026 Shofe • Harare</div>
</div>

<script>
function go(url){ window.location.href=url; }
function openPanel(id){ document.getElementById(id).classList.add('show'); }
function closePanel(id){document.getElementById(id).classList.remove('show')}
function showNotice(){ alert('🔔 No new notifications'); }
</script>
</body>
</html>
