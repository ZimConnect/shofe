<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shofe App</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:#fff}
.header{padding:15px;background:#006400;display:flex;justify-content:space-between;align-items:center}
.header img{width:60px;height:60px;object-fit:contain;border-radius:12px} /* BIGGER LOGO */
.toggle{background:#333;padding:6px;border-radius:20px;display:flex;gap:4px;flex-wrap:wrap}
.toggle button{border:0;padding:8px 10px;border-radius:20px;background:transparent;color:#fff;font-size:11px;cursor:pointer}
.toggle .active{background:#ff9800;color:#111}
.section{display:none;padding:15px}
.section.active{display:block}
.card{background:#222;margin:10px 0;padding:15px;border-radius:12px}
.btn{width:100%;padding:14px;border:0;border-radius:10px;font-weight:bold;margin:8px 0;cursor:pointer}
.btn.green{background:#00c853;color:#111}
.btn.orange{background:#ff9800;color:#111}
.btn.blue{background:#1976d2;color:#fff}
.btn.purple{background:#8e24aa;color:#fff}
input,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:0;background:#333;color:#fff;box-sizing:border-box}
.live-btn{width:180px;height:180px;border-radius:50%;margin:20px auto;display:block;font-size:20px;background:#d71920;color:#fff;border:0}
</style>
</head>
<body>

<div class="header">
  <img src="assets/shofe-logo.png" alt="Shofe">
  <div class="toggle">
    <button id="riderTab" onclick="switchMode('passenger')">Passenger</button>
    <button id="driverTab" onclick="switchMode('driver')">Driver</button>
    <button id="roadTab" onclick="switchMode('roadside')">Roadside</button>
    <button id="nightTab" onclick="switchMode('nightowl')">Night Owl</button>
  </div>
</div>

<!-- 1. PASSENGER -->
<section id="passenger" class="section">
  <h2>🚖 Where to?</h2>
  <div class="card">
    <input id="pickup" placeholder="📍 Pickup">
    <input id="dropoff" placeholder="🏁 Dropoff">
    <h3>Your Bid $USD</h3>
    <input id="bid" type="number" placeholder="e.g. 10">
    <button class="btn orange" onclick="postRide()">POST RIDE REQUEST</button>
    <p id="pStatus"></p>
  </div>
</section>

<!-- 2. DRIVER -->
<section id="driver" class="section">
  <h2>🚗 Driver Dashboard</h2>
  <button id="liveBtn" class="live-btn" onclick="toggleLive()">GO LIVE</button>
  <div id="rideBids" class="card" style="display:none">
    <h3>🔔 INCOMING JOBS</h3>
  </div>
</section>

<!-- 3. ROADSIDE -->
<section id="roadside" class="section">
  <h2>🔧 Roadside Assistance</h2>
  <div class="card">
    <input id="rLocation" placeholder="📍 Your Location">
    <select id="rProblem">
      <option>Flat Tire</option><option>Dead Battery</option>
      <option>Out of Fuel</option><option>Towing</option>
    </select>
    <input id="rBid" type="number" placeholder="Your Offer $">
    <button class="btn orange" onclick="postRoadside()">REQUEST HELP</button>
    <p id="rStatus"></p>
  </div>
</section>

<!-- 4. NIGHT OWL -->
<section id="nightowl" class="section">
  <h2>🌙 Night Owl - Drive My Car</h2>
  <div class="card">
    <p style="color:#aaa;font-size:14px">Had drinks? $20 + $1/km. We drive your car home safely.</p>
    <input id="nPickup" placeholder="📍 Where are you now?">
    <input id="nDropoff" placeholder="🏠 Where is home?">
    <button class="btn purple" onclick="postNightOwl()">BOOK DRIVER</button>
    <p id="nStatus"></p>
  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
// PASTE YOUR FIREBASE CONFIG HERE
const firebaseConfig = {
  apiKey: "PASTE_YOURS",
  authDomain: "shofe-zim.firebaseapp.com",
  projectId: "shofe-zim",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let isLive = false;
let unsubscribe = null;

// FIX 1: ADDED SWITCHMODE
function switchMode(m){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.toggle button').forEach(b=>b.classList.remove('active'));
  document.getElementById(m).classList.add('active');
  const tabId = m=='passenger'?'riderTab':m=='driver'?'driverTab':m=='roadside'?'roadTab':'nightTab';
  document.getElementById(tabId).classList.add('active');
}
switchMode('passenger');

// PASSENGER
function postRide(){
  db.collection("jobs").add({
    type:"ride", pickup:pickup.value, dropoff:dropoff.value, 
    passenger_bid:Number(bid.value), status:"open", 
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });
  pStatus.innerText = `✅ Posted! Waiting for drivers to bid on $${bid.value}`;
}

// ROADSIDE
function postRoadside(){
  db.collection("jobs").add({
    type:"roadside", location:rLocation.value, problem:rProblem.value, 
    passenger_bid:Number(rBid.value), status:"open", createdAt:new Date()
  });
  rStatus.innerText = `✅ Mechanic notified`;
}

// NIGHT OWL
function postNightOwl(){
  db.collection("jobs").add({
    type:"nightowl", pickup:nPickup.value, dropoff:nDropoff.value, 
    status:"open", createdAt:new Date()
  });
  nStatus.innerText = `✅ Driver assigned to drive your car home`;
}

// FIX 2: ADDED isLive VARIABLE
function toggleLive(){
  isLive = !isLive;
  liveBtn.style.background = isLive ? '#00c853' : '#d71920';
  liveBtn.innerText = isLive ? 'GO OFFLINE' : 'GO LIVE';
  rideBids.style.display = isLive ? 'block' : 'none';
  if(isLive){ listenForJobs() } else { if(unsubscribe) unsubscribe(); }
}

function listenForJobs(){
  unsubscribe = db.collection("jobs").where("status","==","open")
  .onSnapshot(snapshot => {
    rideBids.innerHTML = "<h3>🔔 INCOMING JOBS</h3>";
    snapshot.forEach(doc => {
      const job = doc.data();
      let details = job.type=="ride" ? `${job.pickup} → ${job.dropoff}` : job.location || job.pickup;
      rideBids.innerHTML += `
        <div class="card" style="background:#333">
          <b>${job.type.toUpperCase()}</b><br>${details}<br>
          Bid: $${job.passenger_bid || '20+'}<br>
          <button class="btn green" onclick="acceptJob('${doc.id}')">ACCEPT</button>
        </div>
      `;
    });
  });
}

// FIX 3: CLOSED THE FUNCTION
function acceptBid(rideId, price){
  db.collection("jobs").doc(rideId).update({status: "accepted", driver_price: price});
  alert(`Accepted job for $${price}`)
}

function acceptJob(jobId){ acceptBid(jobId) }

function counterBid(rideId){ 
  const p = prompt("Your counter price $"); 
  if(p){ db.collection("bids").add({rideId, driver_price: Number(p)}) }
  alert(`Countered $${p}`) 
} // FIX 4: CLOSED BRACKET
</script>
</body>
</html>
